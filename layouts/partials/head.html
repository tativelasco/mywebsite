<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    {{ $desc := .Params.description | default .Site.Params.description }}
    <meta name="description" content="{{ $desc }}">
    <link rel="canonical" href="{{ .Permalink }}">
    <meta name="author" content="{{ .Site.Params.author }}">

    <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}">
    <meta property="og:description" content="{{ $desc }}">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:type" content="website">
    {{ with .Site.Params.profilePicture }}<meta property="og:image" content="{{ . | absURL }}">{{ end }}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">

    {{ $style := resources.Get "sass/researcher.scss" | resources.ExecuteAsTemplate "sass/researcher.scss" . | css.Sass | minify }}
    <link rel="stylesheet" href="{{ $style.RelPermalink }}">
    <link rel="stylesheet" href="{{ "css/custom.css" | relURL }}">

    <link rel="icon" href="{{ "favicon.ico" | absURL }}" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ "favicon-32x32.png" | absURL }}">
    <link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | absURL }}">

    {{ if .IsHome }}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Tatiana Velasco",
      "alternateName": "Tatiana Velasco Rodríguez",
      "url": "{{ .Site.BaseURL }}",
      "image": "{{ "me.jpg" | absURL }}",
      "jobTitle": "Senior Research Associate",
      "worksFor": {
        "@type": "Organization",
        "name": "Community College Research Center, Teachers College, Columbia University",
        "url": "https://ccrc.tc.columbia.edu"
      },
      "alumniOf": [
        {"@type": "CollegeOrUniversity", "name": "Teachers College, Columbia University"},
        {"@type": "CollegeOrUniversity", "name": "Universidad de los Andes"}
      ],
      "knowsAbout": ["Dual enrollment", "Community college transfer", "Economics of education", "Higher education policy", "Labor market outcomes"],
      "sameAs": [
        "https://ccrc.tc.columbia.edu/person/tatiana-velasco.html",
        "https://www.linkedin.com/in/tatianavelascoro/",
        "https://scholar.google.com/citations?user=qGSKVYkAAAAJ",
        "https://www.instagram.com/collegetati/"
      ]
    }
    </script>
    {{ end }}
</head>
